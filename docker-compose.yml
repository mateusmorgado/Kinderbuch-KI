# Local MongoDB for development.
# Start with: docker compose up -d
# Backend/.env: MONGO_URI=mongodb://127.0.0.1:27017/kinderbuch
services:
  mongo:
    image: mongo:7
    container_name: kinderbuch-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
